[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "agents*", "models*", "services*"]

[project]
name = "edutechai"
version = "0.1.0"
description = "Adaptive AI-powered learning platform with multi-agent Socratic tutoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ─── Web Framework ───
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",

    # ─── LLM ───
    "groq>=0.11.0",

    # ─── HTTP Client ───
    "httpx>=0.27.0",

    # ─── YouTube ───
    "youtube-transcript-api>=0.6.0",

    # ─── Vector Store ───
    "chromadb>=0.5.0",

    # ─── Database (ORM) ───
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",

    # ─── Config & Validation ───
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",

    # ─── Frontend ───
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[project.scripts]
edutechai = "main:main"
