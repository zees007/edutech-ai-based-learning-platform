info:
  name: Create Subscription Tier
  type: http
  seq: 3
  tags:
    - Admin
    - Tiers

http:
  method: POST
  url: "{{baseUrl}}/api/v1/admin/tiers"
  auth: inherit
  body:
    type: json
    data: |-
      {
        "slug": "enterprise",
        "name": "Enterprise Plan",
        "description": "Unlimited team sessions, priority support, and bespoke custom curriculum.",
        "role_id": "{{roleId}}",
        "price_monthly": 99.0,
        "price_annual": 990.0,
        "currency": "USD",
        "monthly_session_limit": null,
        "follow_up_limit_per_step": null,
        "youtube_limit_per_step": 5,
        "is_public": true,
        "order_index": 4
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

