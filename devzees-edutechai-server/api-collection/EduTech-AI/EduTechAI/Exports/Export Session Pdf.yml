info:
  name: Export Session Pdf
  type: http
  seq: 2
  tags:
    - Exports

http:
  method: GET
  url: "{{baseUrl}}/api/v1/export/:session_id/pdf"
  params:
    - name: session_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/export/:session_id/pdf"
      method: GET
      params:
        - name: session_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/export/:session_id/pdf"
      method: GET
      params:
        - name: session_id
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: |-
  Export the learning session as a clean, branded PDF file.
  Requires ET_EXPORT_PDF privilege (Ultra).
  Only available when the learning session is 100% completed.
