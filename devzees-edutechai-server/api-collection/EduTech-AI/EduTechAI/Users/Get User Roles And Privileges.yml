info:
  name: Get User Roles And Privileges
  type: http
  seq: 8
  tags:
    - Users

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/:user_id/roles"
  params:
    - name: user_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/users/:user_id/roles"
      method: GET
      params:
        - name: user_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "user_id": "",
            "roles": [
              {
                "id": "",
                "name": "",
                "privileges": [
                  {
                    "id": 0,
                    "name": "",
                    "code": "",
                    "order_number": "",
                    "parent_id": ""
                  }
                ],
                "created_at": "",
                "retired": false,
                "retired_at": "",
                "retired_by": ""
              }
            ],
            "privileges": [
              {
                "id": 0,
                "name": "",
                "code": "",
                "order_number": "",
                "parent_id": ""
              }
            ],
            "privilege_codes": []
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/users/:user_id/roles"
      method: GET
      params:
        - name: user_id
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: Get assigned roles and computed fine-grained privileges for a user.
