info:
  name: Validate Coupon
  type: http
  seq: 4
  tags:
    - Subscriptions

http:
  method: POST
  url: "{{baseUrl}}/api/v1/subscriptions/validate-coupon"
  body:
    type: json
    data: |-
      {
        "coupon_code": "",
        "tier": "",
        "billing_cycle": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/subscriptions/validate-coupon"
      method: POST
      body:
        type: json
        data: |-
          {
            "coupon_code": "",
            "tier": "",
            "billing_cycle": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "valid": false,
            "coupon_code": "",
            "discount_percent": 0,
            "discount_amount": 0,
            "original_price": 0,
            "final_price": 0,
            "message": ""
          }
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/subscriptions/validate-coupon"
      method: POST
      body:
        type: json
        data: |-
          {
            "coupon_code": "",
            "tier": "",
            "billing_cycle": ""
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: Validate a promotional coupon code and calculate discounted pricing.
