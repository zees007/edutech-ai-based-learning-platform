info:
  name: Get User Transactions
  type: http
  seq: 5
  tags:
    - Subscriptions

http:
  method: GET
  url: "{{baseUrl}}/api/v1/subscriptions/users/:user_id/transactions"
  params:
    - name: user_id
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/subscriptions/users/:user_id/transactions"
      method: GET
      params:
        - name: user_id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": 0,
              "transaction_id": "",
              "user_id": "",
              "gateway_provider": "",
              "amount": 0,
              "currency": "",
              "status": "",
              "tier": "",
              "billing_cycle": "",
              "payment_method": "",
              "coupon_code": "",
              "created_at": ""
            }
          ]
  - name: 422 Response
    description: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/subscriptions/users/:user_id/transactions"
      method: GET
      params:
        - name: user_id
          value: ""
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [],
                "msg": "",
                "type": "",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: Get payment transaction history for a specific user.
